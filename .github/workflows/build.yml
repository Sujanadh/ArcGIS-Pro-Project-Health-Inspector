name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore APHI.sln
      
    - name: Build
      run: dotnet build APHI.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test APHI.sln --no-build --verbosity normal --configuration Release
